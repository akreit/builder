name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Cache sbt target directories
        uses: actions/cache@v4
        with:
          path: |
            target
            project/target
            project/project/target
            builder-docs/target
          key: sbt-target-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/*.sbt', 'project/*.scala') }}-${{ hashFiles('src/**', 'builder-docs/src/**', 'docs/**') }}
          restore-keys: |
            sbt-target-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/*.sbt', 'project/*.scala') }}-
            sbt-target-${{ runner.os }}-
      - name: Check formatting
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck"
      - name: Check scalafix
        run: sbt "scalafixAll --check"
      - name: Test
        run: sbt testFull
      - name: Docs (mdoc)
        run: sbt docs/mdoc
