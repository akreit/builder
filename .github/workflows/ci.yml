name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Cache sbt target directories
        uses: actions/cache@v4
        with:
          path: |
            target
            project/target
            project/project/target
            builder-docs/target
          key: sbt-target-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/**') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            sbt-target-${{ runner.os }}-${{ hashFiles('build.sbt','project/**') }}-
      - name: Check formatting
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck"
      - name: Check scalafix
        run: sbt "scalafixAll --check"
      - name: Test
        run: sbt testFull
      - name: Docs (mdoc)
        run: sbt docs/mdoc
      - name: Stage runtime jars
        run: sbt stage
      - name: Docker image
        run: docker build -t builder:ci .
      - name: Docker smoke test (/health)
        run: |
          docker run -d --name builder-ci -p 127.0.0.1:8080:8080 -e ANTHROPIC_API_KEY=dummy-ci builder:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs builder-ci
          exit 1
