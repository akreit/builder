services:
  builder:
    build: .
    image: builder:local
    ports:
      - "${BUILDER_PORT:-8080}:8080"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY fehlt (in .env oder Shell setzen)}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      BUILDER_DATA_DIR: /data
    volumes:
      - builder-data:/data
    restart: unless-stopped

volumes:
  builder-data:
